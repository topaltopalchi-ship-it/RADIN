name: Build Yoldash APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master", "sherpa-offline-integration" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Download Sherpa-ONNX Android library
        run: |
          curl --fail --location --retry 3 --output app/sherpa-onnx-1.13.8.aar https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.8/sherpa-onnx-1.13.8.aar
          echo "633c24321e06b1fe79feafa03ea16cbc0f8a286641e2da3559bac91bdb13bd96  app/sherpa-onnx-1.13.8.aar" | sha256sum --check
      - name: Download multilingual Whisper tiny model for offline ASR
        run: |
          mkdir -p /tmp/sherpa-model app/src/main/assets/sherpa-whisper-tiny
          curl --fail --location --retry 3 --output /tmp/whisper-tiny.tar.bz2 https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-whisper-tiny.tar.bz2
          tar -xjf /tmp/whisper-tiny.tar.bz2 -C /tmp/sherpa-model
          cp /tmp/sherpa-model/sherpa-onnx-whisper-tiny/tiny-encoder.int8.onnx app/src/main/assets/sherpa-whisper-tiny/
          cp /tmp/sherpa-model/sherpa-onnx-whisper-tiny/tiny-decoder.int8.onnx app/src/main/assets/sherpa-whisper-tiny/
          cp /tmp/sherpa-model/sherpa-onnx-whisper-tiny/tiny-tokens.txt app/src/main/assets/sherpa-whisper-tiny/
          ls -lh app/src/main/assets/sherpa-whisper-tiny/
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        run: gradle --no-daemon --max-workers=2 -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g" assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Yoldash-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Prepare release signing key
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Release signing secrets are not configured; skipping signed release build."
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/yoldash-release.jks"
          test -s "$RUNNER_TEMP/yoldash-release.jks"
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - name: Build signed release APK
        if: ${{ steps.signing.outputs.ready == 'true' }}
        env:
          SIGNING_STORE_FILE: ${{ runner.temp }}/yoldash-release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease
      - name: Upload signed release APK
        if: ${{ steps.signing.outputs.ready == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: Yoldash-signed-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
